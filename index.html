

<!DOCTYPE html>
<html>
<head>
    <title>Feed the Cat 🐱</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animated background -->
    <div class="background">
        <span>✨</span>
        <span>💗</span>
        <span>⭐</span>
        <span>🌸</span>
        <span>✨</span>
        <span>💗</span>
        <span>🌸</span>
        <span>⭐</span>
    </div>


    <!-- Main game -->
    <div class="game">

        <h1>🐱 Feed the Cat</h1>

        <p class="subtitle">
            My kitty is hungry!
        </p>


        <!-- BIG CAT -->
        <div class="cat-container">

            <img
                id="catImage"
                src="cat.png"
                alt="Cute hungry cat"
            >

        </div>


        <!-- Cat message -->
        <h2 id="message">
            Feed me please! 😿
        </h2>


        <!-- Food buttons -->
        <div class="food">

            <button onclick="feed('fish')">
                🐟 Fish
            </button>

            <button onclick="feed('chicken')">
                🍗 Chicken
            </button>

            <button onclick="feed('milk')">
                🥛 Milk
            </button>

            <button onclick="feed('carrot')">
                🥕 Carrot
            </button>

        </div>


        <!-- Reset button -->
        <button class="reset" onclick="resetGame()">
            🔄 Reset
        </button>

    </div>


    <script src="script.js"></script>

</body>
</html>
